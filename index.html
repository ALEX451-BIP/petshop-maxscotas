<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="t-title">Maxscotas Petshop</title>
<meta name="description" content="Maxscotas Petshop: alimentos, accesorios y todo para tu mascota. Envíos, redes y tienda online.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
:root{--bg:#fff7ee;--card:#fff;--text:#3a2a1d;--muted:#9a7f6b;--radius:20px;--shadow:0 6px 22px rgba(90,60,30,.10)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:30px 18px 70px}
/* hero */
.hero{background:linear-gradient(135deg,#ff9f43,#ff6b6b);border-radius:28px;padding:30px 22px 26px;text-align:center;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"🐾";position:absolute;font-size:180px;opacity:.12;top:-20px;right:-30px;transform:rotate(-20deg)}
.hero::after{content:"🐾";position:absolute;font-size:120px;opacity:.10;bottom:-30px;left:-20px;transform:rotate(15deg)}
.avatar{font-size:62px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
h1{font-size:30px;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.12)}
.tagline{font-size:14.5px;opacity:.95;margin-top:6px;max-width:420px;margin-left:auto;margin-right:auto}
.badges{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.92);color:#e0533a;box-shadow:0 2px 8px rgba(0,0,0,.10)}
/* promo */
.promo{background:linear-gradient(135deg,#2ec4b6,#1f9d94);color:#fff;border-radius:var(--radius);padding:18px 20px;margin:22px 0 6px;box-shadow:var(--shadow)}
.promo h3{font-size:16px;display:flex;align-items:center;gap:6px}
.promo p{font-size:13.5px;opacity:.95;margin-top:4px}
.promo .big{font-size:19px;font-weight:800;margin-top:10px;letter-spacing:.3px}
/* secciones */
.section{margin-top:30px}
.section h2{font-size:14px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 4px 12px;display:flex;align-items:center;gap:8px}
/* catalogo */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(90,60,30,.06)}
.prod .ph{height:86px;border-radius:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:44px}
.ph-green{background:#d8f3ec}.ph-gold{background:#fef3d7}.ph-orange{background:#ffe7d4}.ph-pink{background:#ffe0df}.ph-violet{background:#ece4fa}.ph-blue{background:#dcebfb}
.prod h3{font-size:15px}
.prod .desc{font-size:12.5px;color:var(--muted);margin-top:2px;min-height:32px}
.prod .price{font-size:16px;font-weight:800;color:#e0533a;margin-top:8px}
.prod .price small{font-size:11px;font-weight:600;color:#21a57d;display:block}
/* botones */
.links{display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);font-size:15px;font-weight:600;border:1px solid rgba(90,60,30,.06);transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn .ic{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.btn .txt{display:flex;flex-direction:column;min-width:0}
.btn .sub{font-size:12px;font-weight:500;color:var(--muted)}
.btn .go{margin-left:auto;color:var(--muted);font-size:18px}
.ic-wa{background:#25d366}.ic-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ic-fb{background:#1877f2}.ic-tk{background:#161616}.ic-ml{background:#ffe600;color:#333!important}.ic-web{background:#7c3aed}
.ic-mail{background:#64748b}.ic-sh{background:#e91e63}.ic-rosa{background:#ff8fab}.ic-celeste{background:#00b4d8}
.ic-verde{background:#2a9d8f}.ic-naranja{background:#f77f00}.ic-dorado{background:#d4a017}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px}
footer .paw{font-size:22px;display:block;margin-bottom:6px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const LS_KEY='msp_data_v2';
const DEFAULT={
  nombre:'Maxscotas Petshop',
  avatar:'🐾',
  tagline:'Encontrá todo lo que buscás para tu mascota. Estamos para ayudarte 🧡',
  badges:['🐕 Alimentos balanceados','🚚 Envíos a CABA y GBA','💵 10% OFF en efectivo'],
  promo:{activa:true,titulo:'🔥 Envío gratis EN EL DÍA',texto:'En CABA a partir de $29.000. También vendemos por MercadoLibre y tienda online.',big:'PAGÁ CON CRÉDITO / DÉBITO O EFECTIVO'},
  productos:[
    {emoji:'🐶',titulo:'Alimentos balanceados',desc:'Las mejores marcas de alimento para perros y gatos.',precio:'Desde $30.000',precioChico:'/ pack',color:'green'},
    {emoji:'🐱',titulo:'Snacks y premiun',desc:'Golosinas y premios para consentir a tu mascota.',precio:'Por unidad',precioChico:'consultá',color:'pink'},
    {emoji:'🛁',titulo:'Higiene y cuidado',desc:'Shampoo, peines y accesorios de aseo.',precio:'Consultá',precioChico:'variedad',color:'gold'},
    {emoji:'🎾',titulo:'Juguetes',desc:'Pelotas, cuerdas y juguetes interactivos.',precio:'Desde $8.000',precioChico:'/ c/u',color:'orange'}
  ],
  comprar:[
    {icono:'🛒',label:'Tienda online',sub:'Pedidos por WhatsApp',url:'#',color:'web'},
    {icono:'',label:'Nosotros en MercadoLibre',sub:'Comprá con tu cuenta de MercadoLibre',url:'https://www.mercadolibre.com',color:'ml'},
    {icono:'🛍️',label:'Mercado Shops',sub:'Nuestra tienda oficial',url:'https://mercadoshops.com/',color:'sh'}
  ],
  sociales:[
    {label:'WhatsApp',sub:'Atendemos tus pedidos y consultas',url:'#',color:'wa'},
    {label:'Instagram',sub:'@maxscotas.petshop',url:'#',color:'ig'},
    {label:'Facebook',sub:'Maxscotas Petshop',url:'#',color:'fb'},
    {label:'TikTok',sub:'Contenido de mascotas',url:'#',color:'tk'},
    {label:'Email',sub:'contacto@maxscotas.com.ar',url:'mailto:contacto@maxscotas.com.ar',color:'mail'}
  ],
  footer:'Maxscotas Petshop · Con amor para tu mascota · Buenos Aires, Argentina'
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.nombre)return d;}}catch(e){}return DEFAULT;}
let data=load();
const icMap={wa:'💬',ig:'📸',fb:'👍',tk:'🎵',ml:'',mail:'✉️',web:'🛒',sh:'🛍️',rosa:'🧡',celeste:'💙',verde:'💚',naranja:'🧡',dorado:'⭐'};
function btnHTML(b){let ic=b.icono;if(!ic&&b.color&&icMap[b.color]!==undefined)ic=icMap[b.color];return `<a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener"><div class="ic ic-${esc(b.color)}">${ic||'🔗'}</div><div class="txt">${esc(b.label)}<span class="sub">${esc(b.sub||'')}</span></div><div class="go">›</div></a>`;}
document.getElementById('app').innerHTML=`
  <div class="hero">
    <span class="avatar">${esc(data.avatar)||'🐾'}</span>
    <h1>${esc(data.nombre)}</h1>
    <p class="tagline">${esc(data.tagline)}</p>
    <div class="badges">${(data.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</div>
  </div>
  ${data.promo&&data.promo.activa?`<div class="promo"><h3>${esc(data.promo.titulo)}</h3><p>${esc(data.promo.texto)}</p><div class="big">${esc(data.promo.big)}</div></div>`:''}
  <div class="section">
    <h2>🛒 Catálogo destacado</h2>
    <div class="grid">${(data.productos||[]).map(p=>`<div class="prod"><div class="ph ph-${esc(p.color)}">${esc(p.emoji)}</div><h3>${esc(p.titulo)}</h3><p class="desc">${esc(p.desc)}</p><div class="price">${esc(p.precio)}<small>${esc(p.precioChico)}</small></div></div>`).join('')}</div>
  </div>
  <div class="section">
    <h2>🛍️ Comprá ahora</h2>
    <div class="links">${(data.comprar||[]).map(btnHTML).join('')}</div>
  </div>
  <div class="section">
    <h2>📱 Seguinos</h2>
    <div class="links">${(data.sociales||[]).map(btnHTML).join('')}</div>
  </div>
  <footer><span class="paw">🐾</span>${esc(data.footer)}</footer>`;
document.getElementById('t-title').textContent=data.nombre;
</script>
</body>
</html>
